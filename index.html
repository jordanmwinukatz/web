    <script>
    (function() {
      var overlay = document.getElementById('mob-nav-overlay');
      var drawer  = document.getElementById('mob-nav-drawer');
      var closeBtn = document.getElementById('mob-drawer-close-btn');
      var isOpen  = false;

      function openDrawer() {
        isOpen = true;
        overlay.style.display = 'block';
        // Force reflow then add open classes for transition
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            overlay.classList.add('open');
            drawer.classList.add('open');
          });
        });
        document.body.style.overflow = 'hidden';
        drawer.setAttribute('aria-hidden', 'false');
      }

      function closeDrawer() {
        isOpen = false;
        overlay.classList.remove('open');
        drawer.classList.remove('open');
        document.body.style.overflow = '';
        drawer.setAttribute('aria-hidden', 'true');
        // Hide overlay after transition
        setTimeout(function() {
          if (!isOpen) overlay.style.display = 'none';
        }, 300);
      }

      // Close on overlay click
      overlay.addEventListener('click', closeDrawer);
      // Close on X button
      closeBtn.addEventListener('click', closeDrawer);
      // Close on Escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && isOpen) closeDrawer();
      });

      // Close on nav link click (smooth scroll happens natively since they're anchors)
      drawer.querySelectorAll('[data-mob-link]').forEach(function(link) {
        link.addEventListener('click', function() {
          closeDrawer();
          // If clicking "Start a Trade", also try to scroll to / trigger the order section
          if (link.id === 'mob-start-trade') {
            setTimeout(function() {
              var orderSection = document.getElementById('order');
              if (orderSection) orderSection.scrollIntoView({ behavior: 'smooth' });
            }, 320);
          }
        });
      });

      // Inject the hamburger button into the React header
      // We wait for React to render, then use MutationObserver to keep it in place
      function injectHamburger() {
        var header = document.querySelector('header');
        if (!header) return false;

        var btnContainer = header.querySelector('.flex.items-center.gap-2');
        if (!btnContainer) return false;

        // Don't double-inject
        if (document.getElementById('mob-menu-btn')) return true;

        var btn = document.createElement('button');
        btn.id = 'mob-menu-btn';
        btn.setAttribute('aria-label', 'Open navigation menu');
        btn.setAttribute('aria-expanded', 'false');
        btn.innerHTML = '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>';
        btn.addEventListener('click', function() {
          if (isOpen) closeDrawer(); else openDrawer();
          btn.setAttribute('aria-expanded', String(!isOpen));
        });

        // Prepend inside the flex container (before theme toggle)
        btnContainer.insertBefore(btn, btnContainer.firstChild);
        return true;
      }

      // Try immediately, then observe for React mount
      if (!injectHamburger()) {
        var observer = new MutationObserver(function() {
          if (injectHamburger()) observer.disconnect();
        });
        observer.observe(document.getElementById('root') || document.body, {
          childList: true, subtree: true
        });
      }
    })();
    </script>
