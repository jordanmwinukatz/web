<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FloatLinkPesa KYC — Test Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0f19;
      --surface: #131927;
      --surface-hover: #1a2338;
      --border: #1e293b;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, .35);
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --radius: 16px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ─── Header ─── */
    header {
      width: 100%;
      padding: 28px 0 18px;
      text-align: center;
      background: linear-gradient(180deg, rgba(99,102,241,.08) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -.02em;
      background: linear-gradient(135deg, #818cf8, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p { color: var(--text-dim); font-size: .85rem; margin-top: 4px; }

    /* ─── Main layout ─── */
    .container {
      width: 100%;
      max-width: 1100px;
      padding: 32px 20px 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 720px) { .container { grid-template-columns: 1fr; } }

    /* ─── Cards ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: border-color .25s;
    }
    .card:hover { border-color: rgba(99,102,241,.3); }
    .card-title {
      font-size: .8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-dim);
    }

    /* ─── Video / Preview ─── */
    .media-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
    }
    .media-box video,
    .media-box img,
    .media-box canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
    .media-box .placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-dim); font-size: .85rem; gap: 8px;
    }
    .placeholder svg { width: 40px; height: 40px; opacity: .4; }
    .overlay-badge {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
      padding: 4px 10px; border-radius: 8px; font-size: .7rem;
      font-weight: 600; color: var(--success);
      display: none;
    }
    .overlay-badge.visible { display: block; }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border: none; border-radius: 12px;
      font-family: inherit; font-size: .85rem; font-weight: 600;
      cursor: pointer; transition: all .2s;
    }
    .btn-primary {
      background: var(--accent); color: #fff;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .btn-primary:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: .45; pointer-events: none; box-shadow: none;
    }
    .btn-outline {
      background: transparent; color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { background: var(--surface-hover); }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

    /* ─── File input ─── */
    .file-drop {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      color: var(--text-dim);
      font-size: .82rem;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .file-drop:hover, .file-drop.dragover {
      border-color: var(--accent);
      background: rgba(99,102,241,.06);
    }
    .file-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* ─── Results ─── */
    .results-card { grid-column: 1 / -1; }
    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .result-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .result-item .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-bottom: 8px; }
    .result-item .value { font-size: 1.3rem; font-weight: 700; }
    .result-item .sub { font-size: .78rem; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .status-verified  { background: rgba(34,197,94,.15); color: var(--success); }
    .status-rejected  { background: rgba(239,68,68,.15); color: var(--danger); }
    .status-review    { background: rgba(245,158,11,.15); color: var(--warning); }

    .json-raw {
      margin-top: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: .75rem;
      color: var(--text-dim);
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* ─── Spinner ─── */
    .spinner {
      width: 22px; height: 22px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Toast ─── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface); border: 1px solid var(--border);
      padding: 12px 22px; border-radius: 12px;
      font-size: .82rem; color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
      opacity: 0; transition: all .35s ease;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── Fade-in ─── */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .45s ease both; }
  </style>
</head>
<body>

<header>
  <h1>FloatLinkPesa KYC</h1>
  <p>Identity Verification — Test Client</p>
</header>

<div class="container">

  <!-- ── Selfie Card ── -->
  <div class="card fade-up" style="animation-delay:.05s">
    <span class="card-title">① Live Selfie</span>

    <div class="media-box" id="selfie-box">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="selfie-canvas" style="display:none"></canvas>
      <img id="selfie-preview" style="display:none" alt="Captured selfie" />
      <span class="overlay-badge" id="selfie-badge">✓ Captured</span>
      <div class="placeholder" id="video-placeholder" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9A2.25 2.25 0 0013.5 5.25h-9A2.25 2.25 0 002.25 7.5v9A2.25 2.25 0 004.5 18.75z"/></svg>
        <span>Camera unavailable</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn-capture" disabled>
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>
        Capture Selfie
      </button>
      <button class="btn btn-outline" id="btn-retake" style="display:none">↻ Retake</button>
    </div>
  </div>

  <!-- ── ID Card ── -->
  <div class="card fade-up" style="animation-delay:.12s">
    <span class="card-title">② ID Card Photo</span>

    <div class="media-box" id="id-box">
      <img id="id-preview" style="display:none" alt="ID card preview" />
      <div class="placeholder" id="id-placeholder">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15A2.25 2.25 0 002.25 6.75v10.5A2.25 2.25 0 004.5 19.5z"/></svg>
        <span>Upload or drop an ID card image</span>
      </div>
      <span class="overlay-badge" id="id-badge">✓ Loaded</span>
    </div>

    <div class="file-drop" id="file-drop">
      📎 Click or drag &amp; drop an ID card image here
      <input type="file" id="id-input" accept="image/*" />
    </div>
  </div>

  <!-- ── Verify Button ── -->
  <div class="card fade-up" style="animation-delay:.18s; grid-column: 1 / -1; align-items: center;">
    <button class="btn btn-primary" id="btn-verify" disabled style="padding:14px 48px; font-size:.95rem;">
      🔍 Verify Identity
    </button>
    <p style="font-size:.78rem; color:var(--text-dim);">Capture a selfie and upload an ID card first.</p>
  </div>

  <!-- ── Results ── -->
  <div class="card results-card fade-up" id="results-section" style="display:none; animation-delay:.05s;">
    <span class="card-title">Verification Results</span>

    <div id="results-summary"></div>
    <div class="result-grid" id="result-grid"></div>
    <details style="margin-top:8px">
      <summary style="font-size:.78rem; color:var(--text-dim); cursor:pointer;">Raw JSON Response</summary>
      <pre class="json-raw" id="json-raw"></pre>
    </details>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API_BASE = 'http://localhost:8000';

  // DOM refs
  const video          = document.getElementById('video');
  const selfieCanvas   = document.getElementById('selfie-canvas');
  const selfiePreview  = document.getElementById('selfie-preview');
  const selfieBadge    = document.getElementById('selfie-badge');
  const videoPlaceholder = document.getElementById('video-placeholder');
  const btnCapture     = document.getElementById('btn-capture');
  const btnRetake      = document.getElementById('btn-retake');

  const idInput        = document.getElementById('id-input');
  const idPreview      = document.getElementById('id-preview');
  const idPlaceholder  = document.getElementById('id-placeholder');
  const idBadge        = document.getElementById('id-badge');
  const fileDrop       = document.getElementById('file-drop');

  const btnVerify      = document.getElementById('btn-verify');
  const resultsSection = document.getElementById('results-section');
  const resultsSummary = document.getElementById('results-summary');
  const resultGrid     = document.getElementById('result-grid');
  const jsonRaw        = document.getElementById('json-raw');
  const toastEl        = document.getElementById('toast');

  let selfieBlob = null;
  let idBlob     = null;
  let stream     = null;

  // ── Camera ──
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
      video.srcObject = stream;
      video.style.display = 'block';
      btnCapture.disabled = false;
      toast('📷 Camera is live');
    } catch (e) {
      console.error(e);
      video.style.display = 'none';
      videoPlaceholder.style.display = 'flex';
      toast('⚠️ Could not access camera');
    }
  }

  function captureSelfie() {
    selfieCanvas.width  = video.videoWidth;
    selfieCanvas.height = video.videoHeight;
    selfieCanvas.getContext('2d').drawImage(video, 0, 0);
    selfieCanvas.toBlob(blob => {
      selfieBlob = blob;
      selfiePreview.src = URL.createObjectURL(blob);
      selfiePreview.style.display = 'block';
      video.style.display = 'none';
      selfieBadge.classList.add('visible');
      btnRetake.style.display = 'inline-flex';
      btnCapture.style.display = 'none';
      checkReady();
      toast('✅ Selfie captured');
    }, 'image/jpeg', 0.92);
  }

  function retakeSelfie() {
    selfieBlob = null;
    selfiePreview.style.display = 'none';
    video.style.display = 'block';
    selfieBadge.classList.remove('visible');
    btnRetake.style.display = 'none';
    btnCapture.style.display = 'inline-flex';
    checkReady();
  }

  btnCapture.addEventListener('click', captureSelfie);
  btnRetake.addEventListener('click', retakeSelfie);

  // ── ID Card Upload ──
  function handleIdFile(file) {
    if (!file || !file.type.startsWith('image/')) { toast('⚠️ Please select an image file'); return; }
    idBlob = file;
    const url = URL.createObjectURL(file);
    idPreview.src = url;
    idPreview.style.display = 'block';
    idPlaceholder.style.display = 'none';
    idBadge.classList.add('visible');
    checkReady();
    toast('✅ ID card loaded');
  }

  idInput.addEventListener('change', e => handleIdFile(e.target.files[0]));

  fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('dragover'); });
  fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'));
  fileDrop.addEventListener('drop', e => { e.preventDefault(); fileDrop.classList.remove('dragover'); handleIdFile(e.dataTransfer.files[0]); });

  // ── Ready check ──
  function checkReady() {
    btnVerify.disabled = !(selfieBlob && idBlob);
  }

  // ── Verify ──
  btnVerify.addEventListener('click', async () => {
    if (!selfieBlob || !idBlob) return;

    const originalText = btnVerify.innerHTML;
    btnVerify.innerHTML = '<span class="spinner"></span> Verifying…';
    btnVerify.disabled = true;

    const formData = new FormData();
    formData.append('live_image', selfieBlob, 'selfie.jpg');
    formData.append('id_card_image', idBlob, 'id_card.jpg');
    formData.append('challenge_type', 'passive');

    try {
      const res = await fetch(`${API_BASE}/verify`, { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      const data = await res.json();
      renderResults(data);
      toast('🎉 Verification complete');
    } catch (e) {
      toast(`❌ Error: ${e.message}`);
      console.error(e);
    } finally {
      btnVerify.innerHTML = originalText;
      checkReady();
    }
  });

  // ── Render Results ──
  function renderResults(data) {
    resultsSection.style.display = 'flex';
    resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Status badge
    const statusClass = data.status === 'verified' ? 'status-verified'
                      : data.status === 'rejected' ? 'status-rejected'
                      : 'status-review';
    resultsSummary.innerHTML = `<span class="status-badge ${statusClass}">${data.status}</span>
      <span style="margin-left:12px; font-size:.82rem; color:var(--text-dim);">ID: ${data.verification_id}</span>`;

    // Build cards
    const cards = [];

    // Overall
    cards.push(resultCard('Overall Confidence', pct(data.overall_confidence), ''));

    // Liveness
    if (data.liveness) {
      const checks = data.liveness.checks ? Object.entries(data.liveness.checks).map(([k,v]) => `${k}: ${v ? '✅' : '❌'}`).join('<br>') : '';
      cards.push(resultCard('Liveness', data.liveness.is_live ? '✅ Live' : '❌ Not Live', `Score: ${pct(data.liveness.score)}<br>${checks}`));
    }

    // Face Match
    if (data.face_match) {
      cards.push(resultCard('Face Match', data.face_match.match ? '✅ Match' : '❌ No Match', `Similarity: ${pct(data.face_match.similarity_score)}<br>Distance: ${data.face_match.distance.toFixed(4)}`));
    }

    // Document / OCR
    if (data.document) {
      const ocr = data.document.ocr_data ? Object.entries(data.document.ocr_data).map(([k,v]) => `<b>${k}</b>: ${v}`).join('<br>') : 'No data extracted';
      cards.push(resultCard('Document OCR', data.document.valid_format ? '✅ Valid' : '⚠️ Invalid', ocr));
    }

    resultGrid.innerHTML = cards.join('');
    jsonRaw.textContent = JSON.stringify(data, null, 2);
  }

  function resultCard(label, value, sub) {
    return `<div class="result-item"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  }
  function pct(v) { return v != null ? (v * 100).toFixed(1) + '%' : '—'; }

  // ── Toast ──
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  // ── Init ──
  startCamera();
</script>
</body>
</html>
